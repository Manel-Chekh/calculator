<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display">
      <div id="preview" class="preview"></div>
      <div id="current" class="current">0</div>
    </div>
    <div class="keys" id="keys">
      <button data-action="clear" class="fn">AC</button>
      <button data-action="backspace" class="fn">DEL</button>
      <button data-op="/" class="op">&divide;</button>
      <button data-op="*" class="op">&times;</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button data-op="-" class="op">&minus;</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button data-op="+" class="op">+</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button data-action="equals" class="eq tall">=</button>

      <button data-digit="0" class="wide">0</button>
      <button data-action="dot">.</button>
    </div>
    <p class="hint">Keyboard: 0-9 . + - * / &nbsp;Enter = &nbsp;Backspace &nbsp;Esc</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
